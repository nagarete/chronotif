<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Chronotif 0.2.7 Preview and panel</title>
<!-- Part 4 of the 0.2.7 video: the Preview and the panel. Drawn frame by frame like whatsnew.html:
     render(t) sets everything from the time t in seconds. The phone screen is laid out in dp
     (412x883), matching Panel.kt, NotifList.kt (an open stack's header: title, Show less, ×),
     CardPreview.kt (52 dp buttons, Snooze's choices, the spinner time picker and its "Snooze until"
     button), WhatsNewSheet.kt and the Panel settings page (Material 3 colours taken from a render
     of SetupActivity). Apps, people and notifications are the same made-up ones as the other videos. -->
<style>
  :root {
    --card: rgba(44,44,46,.92); --text-2: rgba(235,235,245,.6); --accent: #a8c7fa;
    --serif: "Newsreader", Georgia, serif; --sans: "Noto Sans", system-ui, sans-serif;
    /* Settings, Material 3 dark */
    --m-page: #0f1013; --m-group: #1f2025; --m-bar: #26272d; --m-text: #e2e2e9; --m-text-2: #c4c6d0; --m-accent: #b0c6ff; --m-on: #152e60;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0b0c10; }
  body { font-family: var(--sans); color: #f4f1ea; }
  #bg { position: absolute; inset: 0; background: radial-gradient(1080px 1920px at 50% 0%, #1b2236 0%, #0b0c10 100%); }
  #bezel { position: absolute; left: 192px; top: 428px; width: 696px; height: 1464px; border-radius: 60px; background: #2a2d36; }
  #bezel::after { content: ""; position: absolute; inset: 4px; border-radius: 57px; background: #08090c; }
  #screen { position: absolute; left: 204px; top: 440px; width: 672px; height: 1440px; border-radius: 48px; overflow: hidden; background: #000; }
  #ui { position: absolute; left: 0; top: 0; width: 412px; height: 883px; transform: scale(1.6311); transform-origin: 0 0; }
  .lay { position: absolute; inset: 0; overflow: hidden; }

  /* captions, as captions.mjs draws them */
  .cap { position: absolute; left: 90px; right: 90px; top: 100px; height: 340px; display: grid; place-items: center;
         text-align: center; font: 500 56px/1.22 var(--serif); letter-spacing: -0.01em; text-wrap: balance; }
  .cap b { font-weight: 700; color: #9db8ff; }
  .kicker { font: 600 30px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: #9db8ff; margin-bottom: 26px; }
  .full { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 28px;
          background: radial-gradient(120% 70% at 50% 35%, #1b2236 0%, #0b0c10 60%); }
  .big { font: 600 150px/1 var(--serif); letter-spacing: -0.03em; }
  .small { font: 400 52px/1.3 var(--serif); color: #c9c6bf; max-width: 820px; margin: 0 auto; text-wrap: balance; }
  .small b { color: #9db8ff; font-weight: 600; }
  .url { margin-top: 30px; font: 600 46px/1 var(--sans); color: #9db8ff; letter-spacing: 0.02em; }
  .url2 { font: 500 36px/1.3 "Noto Sans Mono", monospace; color: #c9c6bf; }

  /* --- inside the phone, in dp --- */
  .fill { position: absolute; inset: 0; }
  .wall { position: absolute; inset: 0; background: linear-gradient(160deg, #3a4a78 0%, #1d2440 45%, #121522 100%); }
  .status { position: absolute; left: 0; right: 0; top: 0; height: 32px; padding: 8px 22px 0; display: flex; justify-content: space-between;
            font: 500 13px var(--sans); color: #fff; z-index: 5; }
  .batt { width: 22px; height: 11px; border: 1.5px solid #fff; border-radius: 3px; position: relative; margin-top: 3px; }
  .batt::after { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 13px; background: #fff; border-radius: 1px; }
  .sec { position: absolute; left: 26px; font: 700 13px var(--sans); color: rgba(255,255,255,.75); text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .ncard { position: absolute; left: 12px; width: 388px; height: 64px; padding: 12px 14px; border-radius: 22px; background: var(--card);
           display: grid; grid-template-columns: 40px 1fr; column-gap: 12px; align-items: center; overflow: hidden; }
  .ncard.dim { background: rgba(44,44,46,.78); }
  .ncard .t { display: flex; justify-content: space-between; font: 600 15px/1.3 var(--sans); color: #fff; }
  .ncard .t span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ncard .t span:last-child { font: 400 13px var(--sans); color: var(--text-2); flex: none; margin-left: 8px; }
  .ncard .b { font: 400 14px/1.35 var(--sans); color: rgba(235,235,245,.78); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; position: relative; flex: none; }
  .ic svg { width: 22px; height: 22px; fill: #fff; }
  .ic.round { border-radius: 50%; font: 600 15px var(--sans); color: #fff; }
  .ic .badge { position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center; border: 2px solid #2c2c2e; }
  .ic .badge svg { width: 10px; height: 10px; }
  .ic .num { position: absolute; left: -5px; top: -5px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: #a8c7fa; color: #0b305f; font: 700 11px/18px var(--sans); text-align: center; }
  .sliver { position: absolute; height: 7px; border-radius: 0 0 12px 12px; }
  .hclock { position: absolute; left: 22px; font: 300 46px/1 var(--sans); color: #fff; }
  .hdate { position: absolute; left: 24px; font: 400 15px var(--sans); color: rgba(255,255,255,.8); }
  .gear { position: absolute; width: 26px; height: 26px; fill: #fff; }
  .shead { position: absolute; left: 12px; right: 12px; height: 36px; display: flex; align-items: center; padding: 6px 2px 2px 6px; }
  .shead .tt { flex: 1; font: 700 17px var(--sans); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); position: relative; border-radius: 10px; }
  .chip { position: relative; overflow: hidden; padding: 6px 12px; border-radius: 15px; background: rgba(255,255,255,.16); font: 700 13px/18px var(--sans); color: #fff; }
  .xbtn { width: 30px; height: 30px; margin-left: 8px; border-radius: 15px; background: rgba(255,255,255,.16); display: grid; place-items: center; }
  .xbtn svg { width: 16px; height: 16px; fill: #fff; }
  .toast { position: absolute; left: 0; right: 0; text-align: center; }
  .toast span { display: inline-block; padding: 9px 16px; border-radius: 18px; background: rgba(32,33,36,.95); font: 400 14px var(--sans); color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.4); }

  .grid { position: absolute; left: 20px; right: 20px; display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 22px; }
  .cell { display: flex; flex-direction: column; align-items: center; }
  .cell .ic { width: 56px; height: 56px; border-radius: 16px; }
  .cell .ic svg { width: 28px; height: 28px; }
  .cell span { margin-top: 6px; font: 400 12px var(--sans); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); }

  /* Preview (CardPreview) */
  .pcard { border-radius: 22px; background: #2c2c2e; overflow: hidden; }
  .phead { display: grid; grid-template-columns: 40px 1fr; column-gap: 12px; padding: 12px 14px; align-items: center; }
  .phead .t { display: flex; justify-content: space-between; font: 600 16px/1.3 var(--sans); color: #fff; }
  .phead .t span:last-child { font: 400 13px var(--sans); color: var(--text-2); }
  .phead .b { margin-top: 2px; font: 400 15px/1.35 var(--sans); color: #fff; }
  .pbtn { display: flex; align-items: center; width: fit-content; position: relative; overflow: hidden; margin-top: 8px; min-width: 180px; height: 52px;
          padding: 0 28px 0 22px; border-radius: 26px; background: #2c2c2e; font: 600 16px var(--sans); color: #fff; }
  .picker { margin-top: 8px; width: fit-content; padding: 4px 26px; border-radius: 22px; background: #2c2c2e; display: flex; gap: 18px; }
  .col { position: relative; width: 52px; height: 150px; overflow: hidden; }
  .col div { position: absolute; left: 0; right: 0; height: 50px; line-height: 50px; text-align: center; font: 400 22px var(--sans); color: #fff; }
  .col .ln { position: absolute; left: 4px; right: 4px; height: 1.5px; background: var(--accent); }

  /* Settings, Material 3 */
  .mpage { position: absolute; inset: 0; background: var(--m-page); }
  .mbar { position: absolute; left: 8px; right: 8px; top: 40px; height: 52px; border-radius: 26px; background: var(--m-bar); display: flex; align-items: center; padding: 0 16px; font: 400 17px var(--sans); color: var(--m-text-2); }
  .mbar svg { width: 24px; height: 24px; fill: var(--m-text); margin-right: 18px; }
  .mbody { position: absolute; left: 0; right: 0; top: 0; padding: 0 12px; }
  .mh1 { font: 400 34px var(--sans); color: var(--m-text); padding: 0 6px; }
  .mlbl { margin: 20px 0 8px 14px; font: 500 14px var(--sans); color: var(--m-accent); }
  .mgroup { margin-top: 3px; padding: 16px 16px; background: var(--m-group); border-radius: 6px; }
  .mgroup.top { border-top-left-radius: 20px; border-top-right-radius: 20px; }
  .mgroup.bot { border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
  .mrow { display: flex; align-items: center; justify-content: space-between; font: 400 17px var(--sans); color: var(--m-text); }
  .mdesc { margin-top: 4px; font: 400 14px/1.4 var(--sans); color: var(--m-text-2); }
  .msw { width: 52px; height: 32px; border-radius: 16px; position: relative; flex: none; margin-left: 14px; }
  .msw i { position: absolute; top: 50%; border-radius: 50%; display: grid; place-items: center; }
  .mbtn { display: inline-block; padding: 10px 20px; border-radius: 20px; font: 500 15px var(--sans); }

  /* What's new (WhatsNewSheet) */
  .wn { position: absolute; left: 16px; right: 16px; padding: 20px 20px 12px; border-radius: 28px; background: #2c2c2e; box-shadow: 0 16px 50px rgba(0,0,0,.5); }
  .wn .up { font: 400 13px var(--sans); color: var(--text-2); }
  .wn h2 { margin: 6px 0 0; font: 700 21px/1.3 var(--sans); color: #fff; }
  .wn li { margin-top: 10px; font: 400 15px/1.4 var(--sans); color: #fff; }
  .wn ul { margin: 6px 0 0; padding-left: 18px; }
  .wn li::marker { color: var(--text-2); }
  .wbtn { display: inline-grid; place-items: center; min-height: 40px; padding: 0 18px; border-radius: 20px; font: 700 14px var(--sans); position: relative; overflow: hidden; }

  .finger { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; z-index: 20;
            background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.8); box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .ripple { position: absolute; inset: 0; background: rgba(255,255,255,.18); border-radius: inherit; }
</style>
<body>
<div id="bg"></div>
<div id="bezel"></div>
<div id="screen"><div id="ui"><div class="lay" id="layA"></div><div class="lay" id="layB"></div></div></div>
<div id="capA"></div><div id="capB"></div>
<div id="full"></div>

<script>
const W = 412, H = 883;
// --- glyphs (24x24) and the made-up apps ---
const P = {
  chat: "M4,3h16a2,2 0,0 1,2 2v10a2,2 0,0 1,-2 2H9l-5,4v-4a2,2 0,0 1,-2 -2V5a2,2 0,0 1,2 -2z",
  parcel: "M12,2l9,4.5v11L12,22l-9,-4.5v-11L12,2zM12,4.2L6.2,7.1 12,10l5.8,-2.9L12,4.2zM5,8.7v7.6l6,3v-7.6l-6,-3zM19,8.7l-6,3v7.6l6,-3V8.7z",
  calendar: "M7,2h2v2h6V2h2v2h2a2,2 0,0 1,2 2v14a2,2 0,0 1,-2 2H5a2,2 0,0 1,-2 -2V6a2,2 0,0 1,2 -2h2V2zM5,9v11h14V9H5zM7,11h4v4H7v-4z",
  bank: "M12,2L21,7v2H3V7l9,-5zM5,10h2v7H5v-7zM9,10h2v7H9v-7zM13,10h2v7h-2v-7zM17,10h2v7h-2v-7zM3,18h18v3H3v-3z",
  photo: "M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z",
  music: "M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z",
  clock: "M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.580-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z",
  camera: "M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9z",
  gear: "M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.920-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z",
  call: "M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z",
  message: "M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z",
  person: "M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z",
  close: "M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z",
  check: "M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z",
  menu: "M3,18h18v-2H3v2zM3,13h18v-2H3v2zM3,6v2h18V6H3z",
};
const svg = (g, s = "") => `<svg viewBox="0 0 24 24" ${s}><path d="${P[g]}"/></svg>`;
const APPS = [
  ["Murmur", "chat", "#2EAD6B"], ["Daybook", "calendar", "#4C6FE0"], ["Fernbank", "bank", "#14806F"], ["Parcelly", "parcel", "#E8813A"],
  ["Glimmer", "photo", "#C2477A"], ["Hum Music", "music", "#7E57C2"], ["Camera", "camera", "#3C4043"], ["Clock", "clock", "#1A73E8"],
  ["Contacts", "person", "#1E88E5"], ["Phone", "call", "#34A853"], ["Messages", "message", "#4285F4"], ["Settings", "gear", "#5F6368"],
].map(([name, g, c]) => ({ name, g, c }));
const app = (n) => APPS.find((a) => a.name === n);
const icon = (a) => `<div class="ic" style="background:${a.c}">${svg(a.g)}</div>`;

// --- timing helpers ---
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const out = (x) => 1 - Math.pow(1 - x, 3);
const k = (t, t0, t1) => ease(clamp((t - t0) / (t1 - t0)));
const ko = (t, t0, t1) => out(clamp((t - t0) / (t1 - t0)));
const mix = (a, b, x) => a + (b - a) * x;
// A tap: finger shows 0.35 s before, presses at t0, lifts 0.25 s after.
const tapAt = (t, t0) => ({ o: k(t, t0 - 0.35, t0 - 0.15) * (1 - k(t, t0 + 0.25, t0 + 0.45)), press: k(t, t0 - 0.05, t0) * (1 - k(t, t0 + 0.12, t0 + 0.2)), rip: clamp(1 - Math.abs(t - t0 - 0.08) / 0.2) });
// A hold: finger shows before t0, presses until t1.
const holdAt = (t, t0, t1) => ({ o: k(t, t0 - 0.35, t0 - 0.15) * (1 - k(t, t1, t1 + 0.2)), press: k(t, t0, t0 + 0.3) * (1 - k(t, t1 - 0.05, t1 + 0.05)) });
const finger = (x, y, o, press = 0) => (o > 0 ? `<div class="finger" style="left:${x}px;top:${y}px;opacity:${o};transform:scale(${1 - press * 0.15})"></div>` : "");
const ripple = (on) => (on > 0 ? `<div class="ripple" style="opacity:${on}"></div>` : "");
const status = (o = 1, time = "9:41") => `<div class="status" style="opacity:${o}"><span>${time}</span><span style="display:flex;gap:6px">▂▄▆ <span class="batt"></span></span></div>`;
function home() {
  const grid = ["Murmur", "Daybook", "Glimmer", "Hum Music", "Fernbank", "Parcelly", "Camera", "Clock"].map((n) =>
    `<div class="cell">${icon(app(n))}<span>${n}</span></div>`).join("");
  const dock = ["Phone", "Messages", "Contacts", "Settings"].map((n) => `<div class="cell">${icon(app(n))}</div>`).join("");
  return `<div class="wall"></div><div class="grid" style="top:520px">${grid}</div><div class="grid" style="top:770px">${dock}</div>`;
}

// --- cards and the panel's list ---
const C = {
  maya: { a: "Murmur", person: ["MC", "#F06292"], title: "Maya Chen", body: "Look at this view", time: "now" },
  dentist: { a: "Daybook", title: "Call the dentist", body: "Reminder · Reschedule the check-up", time: "2m" },
  dentistBack: { a: "Daybook", title: "Call the dentist", body: "Reminder · Reschedule the check-up", time: "now" },
  cafe: { a: "Fernbank", title: "You paid Corner Café", body: "€4.20 · Main account", time: "4m" },
  parcel: { a: "Parcelly", title: "Out for delivery", body: "Arriving today, 2–4 PM", time: "31m", dim: 1 },
  hiking: { a: "Murmur", person: ["H", "#64B5F6"], title: "Hiking crew", body: "Emma Wilson: I’ll drive, room for three", time: "1m", count: 3 },
  lake: { a: "Murmur", person: ["L", "#64B5F6"], title: "Lake trip ⛺", body: "Emma Wilson: I’ll drive, room for three", time: "1m", count: 3 },
  msg1: { a: "Murmur", person: ["EW", "#9575CD"], title: "Emma Wilson", body: "I’ll drive, room for three", time: "1m" },
  msg2: { a: "Murmur", person: ["JO", "#4DB6AC"], title: "Joel Park", body: "Who’s bringing the stove?", time: "3m" },
  msg3: { a: "Murmur", person: ["MC", "#F06292"], title: "Maya Chen", body: "Saturday, leaving at 7?", time: "5m" },
  gym: { a: "Daybook", title: "Gym at 6", body: "Today · 18:00", time: "1h", dim: 1 },
  mayaOld: { a: "Murmur", person: ["MC", "#F06292"], title: "Maya Chen", body: "Look at this view", time: "8m" },
};
function ncard(c, y, o = 1, extra = "", id = "") {
  const a = app(c.a);
  const ic = c.person
    ? `<div class="ic round" style="background:${c.person[1]}">${c.person[0]}<span class="badge" style="background:${a.c}">${svg(a.g)}</span>${c.count ? `<span class="num">${c.count}</span>` : ""}</div>`
    : icon(a);
  return `<div class="ncard ${c.dim ? "dim" : ""}" ${id ? `id="${id}"` : ""} style="top:${y}px;opacity:${o};${extra}">${ic}<div style="min-width:0"><div class="t"><span>${c.title}</span><span>${c.time}</span></div><div class="b">${c.body}</div></div></div>`;
}
// rows: "New" | "Earlier" | { c, dx, o, h (0..1: how much room it takes), press, id } | { head, id, rip, chipRip }
function list(rows, top) {
  let y = top, h = "", first = true;
  for (const r of rows) {
    if (typeof r === "string") {
      if (!first) y += 14;
      h += `<div class="sec" style="top:${y}px">${r}</div>`; y += 24;
    } else if (r.head) {
      h += `<div class="shead" style="top:${y}px;opacity:${r.o ?? 1}"><span class="tt" id="${r.id ?? ""}">${ripple(r.rip ?? 0)}${r.head}</span><span class="chip" id="${r.id ?? ""}-less">${ripple(r.chipRip ?? 0)}Show less</span><span class="xbtn">${svg("close")}</span></div>`;
      y += 42 * (r.h ?? 1);
    } else {
      const hh = r.h ?? 1;
      if (r.c.count && hh > 0) {
        h += `<div class="sliver" style="left:26px;width:360px;top:${y + 64}px;background:rgba(58,58,62,.9);opacity:${r.o ?? 1}"></div>`;
        h += `<div class="sliver" style="left:42px;width:328px;top:${y + 71}px;background:rgba(48,48,52,.85);opacity:${r.o ?? 1}"></div>`;
      }
      if (hh > 0) h += ncard(r.c, y, (r.o ?? 1) * clamp(hh * 1.5 - 0.5), `transform:translateX(${r.dx ?? 0}px) scale(${1 - 0.03 * (r.press ?? 0)})`, r.id ?? "");
      y += (r.c.count ? 88 : 74) * hh;
    }
    first = false;
  }
  return h;
}
// The panel over the home screen: header, then the list.
function panel(rows, opts = {}) {
  const p = opts.p ?? 1;
  const behind = `<div class="fill" style="filter:blur(${14 * p}px);transform:scale(${1 + 0.04 * p})">${home()}</div>`;
  const dim = `<div class="fill" style="background:rgba(0,0,0,${0.3 * p})"></div>`;
  const content = `<div class="fill" style="opacity:${p};transform:translateY(${(p - 1) * 96}px)">
    <div class="hclock" style="top:46px">${opts.clock ?? "9:41"}</div><div class="hdate" style="top:98px">Friday, 20 November</div>
    <svg class="gear" style="left:364px;top:56px" viewBox="0 0 24 24"><path d="${P.gear}"/></svg>
    ${list(rows, 140)}</div>`;
  return behind + dim + content + status(1, opts.clock ?? "9:41");
}

// --- the Preview, over a dimmed screen ---
// st: { c (card), o, buttons: [[id, label]], rip: { id: ripple }, picker: { h, m, pm, flick }, until }
function preview(st) {
  const c = st.c, a = app(c.a);
  const ic = c.person
    ? `<div class="ic round" style="background:${c.person[1]}">${c.person[0]}<span class="badge" style="background:${a.c}">${svg(a.g)}</span></div>` : icon(a);
  const card = `<div class="pcard"><div class="phead">${ic}<div><div class="t"><span>${c.title}</span><span>${c.time}</span></div><div class="b">${c.body}</div></div></div></div>`;
  let below = "";
  if (st.picker) below += picker(st.picker);
  below += (st.buttons ?? []).map(([id, l]) => `<div class="pbtn" id="b-${id}">${ripple(st.rip?.[id] ?? 0)}${l}</div>`).join("");
  const colH = 64 + (st.picker ? 166 : 0) + (st.buttons ?? []).length * 60;
  const top = (H - colH) / 2;
  return `<div class="fill" style="opacity:${st.o}">
    <div class="fill" style="background:rgba(0,0,0,.55);backdrop-filter:blur(${16 * st.o}px)"></div>
    <div style="position:absolute;left:12px;right:12px;top:${top}px;transform:scale(${0.96 + 0.04 * st.o})">${card}${below}</div></div>`;
}
// The spinner time picker: hour, minute, AM/PM, each a wheel centred on its value (which may be fractional mid-scroll).
function picker(pk) {
  const wheel = (v, n, fmt, id) => {
    let s = `<div class="col" id="${id}">`;
    for (let i = Math.floor(v) - 2; i <= Math.floor(v) + 3; i++) {
      const d = i - v, y = 50 + d * 50;
      const val = ((i % n) + n) % n;
      s += `<div style="top:${y}px;opacity:${clamp(1 - Math.abs(d) * 0.6, 0.15)};color:${Math.abs(d) < 0.5 ? "#fff" : "rgba(255,255,255,.7)"}">${fmt(val)}</div>`;
    }
    return s + `<span class="ln" style="top:50px"></span><span class="ln" style="top:99px"></span></div>`;
  };
  const ampm = `<div class="col"><div style="top:${50 - pk.pm * 50}px;color:${pk.pm < 0.5 ? "#fff" : "rgba(255,255,255,.5)"}">AM</div><div style="top:${100 - pk.pm * 50}px;color:${pk.pm >= 0.5 ? "#fff" : "rgba(255,255,255,.5)"}">PM</div><span class="ln" style="top:50px"></span><span class="ln" style="top:99px"></span></div>`;
  return `<div class="picker">${wheel(pk.h, 12, (x) => String(x === 0 ? 12 : x), "wh")}${wheel(pk.m, 60, (x) => String(x).padStart(2, "0"), "wm")}${ampm}</div>`;
}

// --- Settings → Panel, scrolled to Swipe to clear ---
function msw(on, id) {
  // on: 0 (off) .. 1 (on)
  const track = on > 0.5 ? "var(--m-accent)" : "#2f3036";
  const border = on > 0.5 ? "none" : "2px solid #8f9099";
  const size = mix(16, 24, on), x = mix(8, 24, on);
  return `<span class="msw" id="${id}" style="background:${track};border:${border}"><i style="left:${x}px;width:${size}px;height:${size}px;margin-top:${-size / 2}px;background:${on > 0.5 ? "var(--m-on)" : "#8f9099"}">${on > 0.8 ? svg("check", `style="width:16px;height:16px;fill:#b0c6ff"`) : ""}</i></span>`;
}
function panelSettings(on, scroll) {
  const row = (l, v, cls = "") => `<div class="mgroup ${cls}"><div class="mrow"><span>${l}</span>${msw(v, "")}</div></div>`;
  return `<div class="mpage"></div><div class="mbody" style="top:${110 - scroll}px">
    <div class="mh1">Panel</div><div class="mlbl">Header</div>
    <div class="mgroup top"><div class="mdesc" style="margin:0">The clock and date at the top of the panel. Tap the clock to open your alarms, the date to open your calendar, or the gear to open your phone’s settings.</div></div>
    ${row("Clock", 1)}${row("Show weekday", 1)}${row("Show year", 0)}${row("Short names", 0)}${row("Settings button", 1, "bot")}
    <div class="mgroup top" style="margin-top:12px"><div class="mdesc" style="margin:0">You can also add the “Chronotif” tile to Quick Settings.</div>
      <div style="margin-top:12px"><span class="mbtn" style="background:var(--m-accent);color:var(--m-on)">Open panel now</span> <span class="mbtn" style="background:#2f3036;color:var(--m-text)">+ Chronotif</span></div></div>
    <div class="mgroup bot"><div class="mrow"><span style="font-size:18px">Swipe to clear</span>${msw(on, "swipe-sw")}</div>
      <div class="mdesc" style="padding-right:66px">Swipe a card sideways to clear it. When this is off, press and hold a card and tap Clear in its Preview, or use a section’s Clear.</div></div>
  </div><div style="position:absolute;left:0;right:0;top:0;height:100px;background:var(--m-page)"></div><div class="mbar">${svg("menu")}Search settings</div>${status()}`;
}

// --- What's new, over the panel ---
const NOTES = [
  "The panel opens faster, most of all the first time after an update.",
  "Swipe down on the status bar and the panel follows your finger, like the system shade.",
  "Snooze a notification from its Preview. It comes back as new.",
  "The lock screen leaves room for the time: new notifications wait at the bottom as a pile.",
];
function whatsNew(o, scroll, rips = {}) {
  return `<div class="fill" style="background:rgba(0,0,0,${0.45 * o})"></div>
    <div class="wn" id="wn" style="top:${210 + (1 - o) * 24}px;opacity:${o}"><div class="up">Updated to 0.2.7</div>
    <h2>The panel comes down under your finger, and the edge handle is yours to shape.</h2>
    <div style="height:300px;overflow:hidden;margin-top:6px"><ul style="transform:translateY(${-scroll}px)">${NOTES.map((n) => `<li>${n}</li>`).join("")}</ul></div>
    <div style="margin-top:16px;display:flex;justify-content:flex-end;gap:8px"><span class="wbtn" style="background:rgba(255,255,255,.12);color:#fff">All release notes</span>
    <span class="wbtn" id="gotit" style="background:var(--accent);color:#0b305f">${ripple(rips.got ?? 0)}Got it</span></div></div>`;
}

// --- scenes: [start, end, kicker, caption, draw(t)] ---
const BASE = (extra = {}) => ["New", { c: C.maya }, { c: C.dentist, ...extra.dentist }, { c: C.cafe, ...extra.cafe }, "Earlier", { c: C.parcel }, { c: C.gym }];
const SNOOZE_BTNS = [["15", "15 minutes"], ["60", "1 hour"], ["180", "3 hours"], ["tm", "Tomorrow morning"], ["pick", "Pick a time…"]];
const DENT_Y = 140 + 24 + 74; // the dentist card's top
const SCENES = [
  [2.25, 8.6, "Snooze it", "Hold a card, then <b>Snooze</b>: 15 minutes, an hour, three hours, or tomorrow morning.", (t) => {
    const hold = holdAt(t, 3.1, 3.75);
    const open = k(t, 3.75, 3.95);
    const sTap = tapAt(t, 5.0);
    const choices = t >= 5.15;
    let h = panel(BASE({ dentist: { press: hold.press } }));
    if (open > 0) h += preview({ c: C.dentist, o: open, buttons: choices ? SNOOZE_BTNS : [["snooze", "Snooze"], ["clear", "Clear"]], rip: { snooze: sTap.rip } });
    const tap = sTap.o > 0 && t < 5.3 ? { id: "b-snooze", o: sTap.o, press: sTap.press } : null;
    return { html: h + finger(206, DENT_Y + 32, hold.o, hold.press), tap };
  }],
  [8.6, 15.4, "Pick a time", "Or <b>pick a time</b>. It shows when the card comes back.", (t) => {
    const pTap = tapAt(t, 9.2);
    const picking = t >= 9.35;
    // From the suggested 10:45 AM: hour to 6, minutes to 30, then PM.
    const hh = mix(10, 6, k(t, 10.0, 10.8)), mm = mix(45, 30, k(t, 11.2, 11.9)), pm = k(t, 12.3, 12.6);
    const hr = Math.round(hh), mi = Math.round(mm);
    const label = `Snooze until ${hr}:${String(mi).padStart(2, "0")} ${pm >= 0.5 ? "PM" : "AM"}`;
    const uTap = tapAt(t, 13.5);
    const close = 1 - k(t, 13.65, 13.85);
    const gone = k(t, 13.9, 14.4);
    let h = panel(BASE({ dentist: { h: 1 - gone } }));
    if (close > 0) h += picking
      ? preview({ c: C.dentist, o: close, picker: { h: hh, m: mm, pm }, buttons: [["until", label]], rip: { until: uTap.rip } })
      : preview({ c: C.dentist, o: 1, buttons: SNOOZE_BTNS, rip: { pick: pTap.rip } });
    // Fingers on the wheels while they turn.
    let f = "";
    if (picking) {
      const top = (H - (64 + 166 + 60)) / 2 + 64 + 8 + 4;
      const fx = (cx, t0, t1, dy) => { const o = k(t, t0 - 0.25, t0) * (1 - k(t, t1, t1 + 0.2)); return finger(cx, top + 75 - dy * k(t, t0, t1), o, 0.1); };
      f += fx(12 + 26 + 26, 10.0, 10.8, -60) + fx(12 + 26 + 52 + 18 + 26, 11.2, 11.9, -50) + fx(12 + 26 + 2 * (52 + 18) + 26, 12.25, 12.6, 40);
    }
    const tap = !picking && pTap.o > 0 ? { id: "b-pick", o: pTap.o, press: pTap.press } : uTap.o > 0 && t < 13.8 ? { id: "b-until", o: uTap.o, press: uTap.press } : null;
    return { html: h + f, tap };
  }],
  [15.4, 20.6, "Back as new", "At 6:30 it comes back, at the top of <b>New</b>.", (t) => {
    // The clock runs on to 6:30 PM, the panel closes and reopens with the reminder back on top.
    const run = k(t, 15.8, 17.0);
    const mins = Math.round(mix(9 * 60 + 41, 18 * 60 + 30, run));
    const hr = Math.floor(mins / 60), clock = `${hr > 12 ? hr - 12 : hr}:${String(mins % 60).padStart(2, "0")}`;
    const back = t >= 17.4;
    const arrive = ko(t, 17.5, 18.0);
    const rows = back
      ? ["New", { c: C.dentistBack, h: arrive, id: "back" }, "Earlier", { c: { ...C.maya, time: "8h", dim: 1 } }, { c: { ...C.cafe, time: "8h", dim: 1 } }, { c: { ...C.parcel, time: "9h" } }]
      : ["New", { c: C.maya }, { c: C.cafe }, "Earlier", { c: C.parcel }, { c: C.gym }];
    let h = panel(rows, { clock });
    const glow = back ? Math.sin(clamp((t - 18.0) / 1.4) * Math.PI) : 0;
    if (glow > 0) h += `<div style="position:absolute;left:12px;width:388px;top:${164}px;height:64px;border-radius:22px;box-shadow:0 0 0 2px rgba(168,199,250,${glow}),0 0 22px rgba(168,199,250,${0.6 * glow})"></div>`;
    return h;
  }],
  [20.6, 25.4, "Clear", "The Preview has a <b>Clear</b> button too.", (t) => {
    const cafeY = 140 + 24 + 74 * 2;
    const hold = holdAt(t, 21.2, 21.85);
    const open = k(t, 21.85, 22.05);
    const cTap = tapAt(t, 23.1);
    const close = 1 - k(t, 23.25, 23.45);
    const gone = k(t, 23.5, 24.0);
    let h = panel(BASE({ cafe: { press: hold.press, h: 1 - gone } }));
    if (open > 0 && close > 0) h += preview({ c: C.cafe, o: open * close, buttons: [["snooze", "Snooze"], ["clear", "Clear"]], rip: { clear: cTap.rip } });
    const tap = cTap.o > 0 && t < 23.4 ? { id: "b-clear", o: cTap.o, press: cTap.press } : null;
    return { html: h + finger(206, cafeY + 32, hold.o, hold.press), tap };
  }],
  [25.4, 31.4, "Swipe to clear", "Clearing cards by accident? Turn off <b>Swipe to clear</b> under Settings → Panel.", (t) => {
    const scroll = mix(0, 190, k(t, 25.9, 27.2));
    const sTap = tapAt(t, 28.4);
    const on = 1 - k(t, 28.45, 28.65);
    return { html: panelSettings(on, scroll), tap: sTap.o > 0 ? { id: "swipe-sw", o: sTap.o, press: sTap.press } : null };
  }],
  [31.4, 36.4, "Springs back", "Then a swiped card gives a little and <b>springs back</b>. Clear it from its Preview.", (t) => {
    // Two swipes: the card follows only a little, then springs back.
    const sw = (t0) => { const d = k(t, t0, t0 + 0.35), back = ko(t, t0 + 0.4, t0 + 0.75); return { dx: 34 * d * (1 - back), fx: mix(150, 330, d), fo: k(t, t0 - 0.2, t0) * (1 - k(t, t0 + 0.35, t0 + 0.5)) }; };
    const a = sw(32.2), b = sw(33.9);
    const dx = a.dx + b.dx;
    const y = 140 + 24 + 74 * 2 + 32;
    return panel(["New", { c: C.maya }, { c: C.dentist }, { c: C.cafe, dx }, "Earlier", { c: C.parcel }, { c: C.gym }]) +
      finger(a.fx, y, a.fo) + finger(b.fx, y, b.fo);
  }],
  [36.4, 42.6, "Close a stack", "Tap an open stack’s <b>name</b> to close it, as well as Show less.", (t) => {
    const oTap = tapAt(t, 37.1);
    const open = ko(t, 37.2, 37.6);
    const nTap = tapAt(t, 39.9);
    const shut = ko(t, 40.0, 40.4);
    const o = open * (1 - shut);
    const rows = o > 0
      ? ["New", { head: "Hiking crew", id: "stack-name", h: o, o, rip: nTap.rip }, { c: C.msg1, h: o, o }, { c: C.msg2, h: o, o }, { c: C.msg3, h: o, o }, { c: C.mayaOld, h: 1 }, "Earlier", { c: C.parcel }]
      : ["New", { c: C.hiking, id: "stack" }, { c: C.mayaOld }, "Earlier", { c: C.parcel }, { c: C.gym }];
    const tap = oTap.o > 0 && t < 37.4 ? { id: "stack", o: oTap.o, press: oTap.press } : nTap.o > 0 ? { id: "stack-name", o: nTap.o, press: nTap.press } : null;
    return { html: panel(rows), tap };
  }],
  [42.6, 48.0, "New names", "When an app renames a chat, the panel shows the <b>new name</b> the next time it opens.", (t) => {
    // Murmur renames the group; the panel closes, and opens again with the new name.
    const note = k(t, 43.2, 43.5) * (1 - k(t, 45.0, 45.3));
    const closed = k(t, 45.1, 45.4) * (1 - k(t, 45.9, 46.2));
    const renamed = t >= 45.6;
    let h = panel(["New", { c: renamed ? C.lake : C.hiking }, { c: C.mayaOld }, "Earlier", { c: C.parcel }, { c: C.gym }], { p: 1 - closed });
    if (closed > 0) h = `<div class="fill" style="opacity:${closed}">${home()}${status()}</div>` + `<div class="fill" style="opacity:${1 - closed}">${h}</div>`;
    if (note > 0) h += `<div class="toast" style="top:620px;opacity:${note}"><span>In Murmur: Emma renamed the group “Lake trip ⛺”</span></div>`;
    const glow = renamed ? Math.sin(clamp((t - 46.2) / 1.3) * Math.PI) : 0;
    if (glow > 0) h += `<div style="position:absolute;left:12px;width:388px;top:164px;height:64px;border-radius:22px;box-shadow:0 0 0 2px rgba(168,199,250,${glow}),0 0 22px rgba(168,199,250,${0.6 * glow})"></div>`;
    return h;
  }],
  [48.0, 55.0, "What’s new", "After an update, the panel first shows <b>what’s new</b>, only that. Your cards stay New until you close it.", (t) => {
    const p = k(t, 48.5, 48.75);
    const sheet = k(t, 48.8, 49.1);
    const scroll = mix(0, 70, k(t, 50.4, 51.6));
    const gTap = tapAt(t, 52.6);
    const gone = 1 - k(t, 52.75, 52.95);
    let h = p > 0 ? panel(["New", { c: C.maya }, { c: C.dentist }, { c: C.cafe }, "Earlier", { c: C.parcel }, { c: C.gym }], { p }) : home() + status();
    if (sheet > 0 && gone > 0) h += whatsNew(sheet * gone, scroll, { got: gTap.rip });
    // New stays lit while the sheet is up.
    const lit = t > 53.0 ? Math.sin(clamp((t - 53.0) / 1.4) * Math.PI) : 0;
    if (lit > 0) h += `<div class="sec" style="top:140px;color:#a8c7fa;text-shadow:0 0 ${8 * lit}px #a8c7fa">New</div>`;
    const tap = gTap.o > 0 && t < 52.9 ? { id: "gotit", o: gTap.o, press: gTap.press } : null;
    return { html: h, tap };
  }],
];
const FULL = [
  [0, 2.6, `<div class="big">Chronotif</div><div class="small">What’s new in <b>0.2.7</b>, part 4: the <b>Preview</b> and the <b>panel</b>.</div>`],
  [54.65, 59.6, `<div class="big">Help shape it</div><div class="small">Ideas or bugs? Tell us. Chronotif gets better from what you report.</div>
    <div class="url">github.com/nagarete/chronotif/issues</div><div class="url2">chronotif.com</div>`],
];
const XF = 0.35;
const $ = (id) => document.getElementById(id);
const capHTML = (kick, text) => `<div class="cap"><div><div class="kicker">${kick}</div>${text}</div></div>`;
const S = 1.6311;

// Puts a scene into a layer; a scene may return { html, tap: { id, o, press } } to put the finger on
// an element by id, measured after layout.
function paint(el, r) {
  const { html, tap } = typeof r === "string" ? { html: r, tap: null } : r;
  el.innerHTML = html;
  if (tap) {
    const target = el.querySelector(`#${tap.id}`);
    if (target) {
      const b = target.getBoundingClientRect(), s = $("screen").getBoundingClientRect();
      el.insertAdjacentHTML("beforeend", finger((b.left + b.width / 2 - s.left) / S, (b.top + b.height / 2 - s.top) / S, tap.o, tap.press));
    }
  }
}

function render(t) {
  let i = SCENES.findIndex(([t0, t1]) => t >= t0 && t < t1);
  if (i < 0) i = t < SCENES[0][0] ? 0 : SCENES.length - 1;
  const [t0, , kick, text, draw] = SCENES[i];
  const prev = SCENES[i - 1];
  const fade = prev ? k(t, t0, t0 + XF) : 1;
  paint($("layA"), prev && fade < 1 ? prev[4](prev[1]) : "");
  paint($("layB"), draw(t));
  $("layB").style.opacity = fade;
  $("capA").innerHTML = prev && fade < 1 ? capHTML(prev[2], prev[3]) : "";
  $("capA").style.opacity = 1 - fade;
  $("capB").innerHTML = capHTML(kick, text);
  $("capB").style.opacity = clamp((t - t0 - 0.15) / 0.3);
  $("full").innerHTML = FULL.filter(([f0, f1]) => t >= f0 && t < f1).map(([f0, f1, html]) =>
    `<div class="full" style="opacity:${f0 === 0 ? 1 - k(t, f1 - XF, f1) : k(t, f0, f0 + XF)}">${html}</div>`).join("");
}
window.render = render;
window.DURATION = 59.6;
render(Number(new URLSearchParams(location.search).get("t") ?? 0));
</script>
