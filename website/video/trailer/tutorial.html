<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Chronotif 0.2.7 tutorial</title>
<!-- Part 6 of the 0.2.7 video: the Tutorial and Usage data. Built like settings.html (part 5). Drawn frame by frame like lock.html: render(t) sets
     everything from the time t in seconds. The screens are the app's own, rendered by Robolectric
     at 412x883 dp (shots/s-*.jpg, 2 px per dp; see settings.md), shown 28 dp down under a drawn
     status bar. Taps, the drawer's slide, the voice sheet and the row flash are drawn over them. -->
<style>
  :root { --accent: #b7c4ff; --serif: "Newsreader", Georgia, serif; --sans: "Noto Sans", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0b0c10; }
  body { font-family: var(--sans); color: #f4f1ea; }
  #bg { position: absolute; inset: 0; background: radial-gradient(1080px 1920px at 50% 0%, #1b2236 0%, #0b0c10 100%); }
  #bezel { position: absolute; left: 192px; top: 428px; width: 696px; height: 1464px; border-radius: 60px; background: #2a2d36; }
  #bezel::after { content: ""; position: absolute; inset: 4px; border-radius: 57px; background: #08090c; }
  #screen { position: absolute; left: 204px; top: 440px; width: 672px; height: 1440px; border-radius: 48px; overflow: hidden; background: #000; }
  #ui { position: absolute; left: 0; top: 0; width: 412px; height: 883px; transform: scale(1.6311); transform-origin: 0 0; }
  .lay { position: absolute; inset: 0; overflow: hidden; }

  .cap { position: absolute; left: 90px; right: 90px; top: 100px; height: 340px; display: grid; place-items: center;
         text-align: center; font: 500 56px/1.22 var(--serif); letter-spacing: -0.01em; text-wrap: balance; }
  .cap b { font-weight: 700; color: #9db8ff; }
  .kicker { font: 600 30px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: #9db8ff; margin-bottom: 26px; }
  .full { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 28px;
          background: radial-gradient(120% 70% at 50% 35%, #1b2236 0%, #0b0c10 60%); }
  .big { font: 600 150px/1 var(--serif); letter-spacing: -0.03em; }
  .small { font: 400 52px/1.3 var(--serif); color: #c9c6bf; max-width: 820px; margin: 0 auto; text-wrap: balance; }
  .small b { color: #9db8ff; font-weight: 600; }
  .url { margin-top: 30px; font: 600 46px/1 var(--sans); color: #9db8ff; letter-spacing: 0.02em; }
  .url2 { font: 500 36px/1.3 "Noto Sans Mono", monospace; color: #c9c6bf; }

  .fill { position: absolute; inset: 0; }
  .shot { position: absolute; left: 0; width: 412px; display: block; }
  .status { position: absolute; left: 0; right: 0; top: 0; height: 28px; padding: 7px 22px 0; display: flex; justify-content: space-between;
            font: 500 13px var(--sans); z-index: 5; }
  .batt { width: 22px; height: 11px; border: 1.5px solid currentColor; border-radius: 3px; position: relative; margin-top: 3px; }
  .batt::after { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 13px; background: currentColor; border-radius: 1px; }
  .wall { position: absolute; inset: 0; background: linear-gradient(160deg, #3a4a78 0%, #1d2440 45%, #121522 100%); }
  .grid { position: absolute; left: 20px; right: 20px; display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 22px; }
  .cell { display: flex; flex-direction: column; align-items: center; }
  .cell .ic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; overflow: hidden; }
  .cell .ic svg { width: 30px; height: 30px; fill: #fff; }
  .cell span { margin-top: 6px; font: 400 12px var(--sans); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .finger { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; z-index: 20;
            background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.8); box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .glow { position: absolute; border-radius: 18px; z-index: 6; }
</style>
<body>
<div id="bg"></div>
<div id="bezel"></div>
<div id="screen"><div id="ui"><div class="lay" id="layA"></div><div class="lay" id="layB"></div></div></div>
<div id="capA"></div><div id="capB"></div>
<div id="full"></div>

<script>
const W = 412, H = 883, TOP = 28;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const out = (x) => 1 - Math.pow(1 - x, 3);
const k = (t, t0, t1) => ease(clamp((t - t0) / (t1 - t0)));
const ko = (t, t0, t1) => out(clamp((t - t0) / (t1 - t0)));
const mix = (a, b, x) => a + (b - a) * x;
const tapAt = (t, t0) => ({ o: k(t, t0 - 0.35, t0 - 0.15) * (1 - k(t, t0 + 0.25, t0 + 0.45)), press: k(t, t0 - 0.05, t0) * (1 - k(t, t0 + 0.12, t0 + 0.2)) });
const finger = (x, y, o, press = 0) => (o > 0 ? `<div class="finger" style="left:${x}px;top:${y}px;opacity:${o};transform:scale(${1 - press * 0.15})"></div>` : "");
const tap = (t, t0, x, y) => { const p = tapAt(t, t0); return finger(x, y, p.o, p.press); };

// Backgrounds of the app's own screens, sampled from the renders.
const DARK = "#0f1013", LIGHT = "#f0f0f8", FIND = "#26272c", DRAWER = "#1a1b1f";
const status = (light = false) => `<div class="status" style="color:${light ? "#1b1b1f" : "#fff"}"><span>9:41</span><span style="display:flex;gap:6px">▂▄▆ <span class="batt"></span></span></div>`;
// A real screen: shot name, scrolled by `scroll` dp; with `bar`, the search bar at its top stays put.
function screen(name, o = {}) {
  const bg = o.bg ?? DARK, s = o.scroll ?? 0;
  let h = `<div class="fill" style="background:${bg}"></div>
    <div style="position:absolute;left:0;right:0;top:${TOP}px;bottom:0;overflow:hidden"><img class="shot" src="shots/${name}.jpg" style="top:${-s}px"></div>`;
  if (o.bar && s > 0) h += `<div style="position:absolute;left:0;right:0;top:${TOP}px;height:58px;overflow:hidden;background:${bg}"><img class="shot" src="shots/${name}.jpg" style="top:0"></div>`;
  return h + (o.extra ?? "") + status(o.light);
}
// Screen y (dp) of a point at y in a shot scrolled by s.
const Y = (y, s = 0) => y + TOP - s;
const glow = (x, y, w, h, o, light = false) => (o > 0 ? `<div class="glow" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:${o};background:${light ? "rgba(70,90,180,.16)" : "rgba(183,196,255,.16)"};box-shadow:inset 0 0 0 2px ${light ? "#4a5ec0" : "var(--accent)"}"></div>` : "");
const pulse = (t, t0, t1) => Math.sin(clamp((t - t0) / (t1 - t0)) * Math.PI);

const ICON = `<svg viewBox="18 18 72 72" style="width:56px;height:56px"><rect x="18" y="18" width="72" height="72" rx="16" fill="#1C1C1E"/>
  <path fill="#FFF" d="M36,34h36a6,6 0,0 1,6 6v14a6,6 0,0 1,-6 6H36a6,6 0,0 1,-6 -6V40a6,6 0,0 1,6 -6z"/>
  <path fill="#0A84FF" d="M41,40.5a4.5,4.5 0,1 1,0 9a4.5,4.5 0,1 1,0 -9z"/>
  <path fill="#FFF" fill-opacity=".6" d="M38,64h32a3,3 0,0 1,0 6H38a3,3 0,0 1,0 -6z"/>
  <path fill="#FFF" fill-opacity=".3" d="M43,73h22a2,2 0,0 1,0 4H43a2,2 0,0 1,0 -4z"/></svg>`;
const G = {
  chat: "M4,3h16a2,2 0,0 1,2 2v10a2,2 0,0 1,-2 2H9l-5,4v-4a2,2 0,0 1,-2 -2V5a2,2 0,0 1,2 -2z",
  calendar: "M7,2h2v2h6V2h2v2h2a2,2 0,0 1,2 2v14a2,2 0,0 1,-2 2H5a2,2 0,0 1,-2 -2V6a2,2 0,0 1,2 -2h2V2zM5,9v11h14V9H5zM7,11h4v4H7v-4z",
  photo: "M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z",
  music: "M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z",
  bank: "M12,2L21,7v2H3V7l9,-5zM5,10h2v7H5v-7zM9,10h2v7H9v-7zM13,10h2v7h-2v-7zM17,10h2v7h-2v-7zM3,18h18v3H3v-3z",
  parcel: "M12,2l9,4.5v11L12,22l-9,-4.5v-11L12,2zM12,4.2L6.2,7.1 12,10l5.8,-2.9L12,4.2zM5,8.7v7.6l6,3v-7.6l-6,-3zM19,8.7l-6,3v7.6l6,-3V8.7z",
  camera: "M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9z",
  mic: "M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z",
};
const glyph = (g, c) => `<div class="ic" style="background:${c}"><svg viewBox="0 0 24 24"><path d="${G[g]}"/></svg></div>`;
// The home screen; `chronotif` puts Chronotif's icon in the first row.
function home(wallFilter = "none") {
  const apps = [["Chronotif", ICON], ["Murmur", glyph("chat", "#2EAD6B")], ["Daybook", glyph("calendar", "#4C6FE0")], ["Glimmer", glyph("photo", "#C2477A")],
    ["Hum Music", glyph("music", "#7E57C2")], ["Fernbank", glyph("bank", "#14806F")], ["Parcelly", glyph("parcel", "#E8813A")], ["Camera", glyph("camera", "#3C4043")]];
  return `<div class="wall" style="filter:${wallFilter}"></div><div class="grid" style="top:560px">${apps.map(([n, ic]) =>
    `<div class="cell">${n === "Chronotif" ? `<div class="ic" id="appicon">${ic}</div>` : ic}<span>${n}</span></div>`).join("")}</div>${status()}`;
}

// --- scenes: [start, end, kicker, caption, draw(t)] ---
// A switch turned off, drawn over the render's switch (centre x, y in screen dp), on a group's background.
const offSwitch = (x, y, o) => `<div style="position:absolute;left:${x - 30}px;top:${y - 19}px;width:60px;height:38px;background:#1f2024;opacity:${o}">
  <div style="position:absolute;left:5px;top:3px;width:52px;height:32px;border-radius:16px;border:2px solid #918f9a;background:#1f2024">
  <div style="position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:50%;background:#918f9a"></div></div></div>`;
const SCENES = [
  [2.25, 8.4, "Tutorial", "Try Chronotif hands-on under <b>Settings → Tutorial</b>, in three parts.", (t) => {
    const g = (a, b) => pulse(t, a, b);
    return screen("s-tutorial") + glow(10, Y(176), 392, 158, g(2.9, 4.1)) + glow(10, Y(349), 392, 166, g(3.9, 5.1)) +
      glow(10, Y(531), 392, 152, g(4.9, 6.1)) + tap(t, 7.5, 109, Y(309));
  }],
  [8.4, 15.6, "The real panel", "Made-up notifications, <b>one step at a time</b>. Your own stay hidden and untouched.", (t) => {
    // The first step's card, then the Panel with the samples and the step done.
    const down = k(t, 10.4, 10.9);
    let h = screen("s-tut-activity", { light: false });
    if (down > 0) h += `<div class="fill" style="clip-path:inset(0 0 ${(1 - down) * 100}% 0)">${screen("s-tut-panel", { bg: "#000" })}</div>`;
    h += glow(10, Y(665), 392, 210, pulse(t, 11.6, 13.6));
    // A swipe down on the edge handle opens it.
    const f = k(t, 9.6, 9.8) * (1 - k(t, 10.8, 11.0));
    return h + finger(400, mix(300, 520, k(t, 9.9, 10.7)), f);
  }],
  [15.6, 21.2, "And the lock screen", "Practise the <b>pile</b>, replying while locked and double-tap to sleep, on a stand-in.", (t) => {
    // The render draws the Pile's count as a blank pill; it's redrawn here.
    const pill = `<div style="position:absolute;left:168px;top:${Y(545)}px;width:76px;height:36px;background:#000"></div>
      <div style="position:absolute;left:0;right:0;top:${Y(548)}px;text-align:center"><span style="display:inline-block;padding:7px 12px;border-radius:15px;background:#2a2a2c;font:700 13px/1.25 var(--sans);color:#fff">2 more</span></div>`;
    return screen("s-tut-lock", { bg: "#000", extra: pill }) + glow(10, Y(585), 392, 228, pulse(t, 16.6, 18.4));
  }],
  [21.2, 27.4, "Usage data", "Chronotif now sends anonymous <b>Usage data</b>. Never anything from your notifications.", (t) => {
    const s = 560 * k(t, 21.6, 22.8);
    return screen("s-gen-tall", { scroll: s, bar: true }) + glow(10, Y(799, s), 392, 162, pulse(t, 23.0, 25.0)) +
      glow(236, Y(906, s), 150, 40, pulse(t, 25.0, 27.0));
  }],
  [27.4, 33.6, "Your call", "Turn it off any time in <b>Privacy and about</b>. What’s sent lists every field.", (t) => {
    const off = k(t, 29.05, 29.25);
    const ver = `<div style="position:absolute;left:0;top:${Y(584)}px;width:260px;height:26px;background:${DARK};padding:4px 0 0 21px;font:400 12.5px var(--sans);color:#c6c5d0">Version 0.2.7</div>`;
    return screen("s-about", { extra: ver + (off > 0 ? offSwitch(352, Y(424), off) : "") }) + tap(t, 28.9, 352, Y(424)) +
      glow(10, Y(505), 392, 72, pulse(t, 30.6, 32.6));
  }],
];
const FULL = [
  [0, 2.6, `<div class="big">Chronotif</div><div class="small">What’s new in <b>0.2.7</b>, part 6: the <b>Tutorial</b> and Usage data.</div>`],
  [33.25, 38.6, `<div class="big">Help shape it</div><div class="small">Ideas or bugs? Tell us. Chronotif gets better from what you report.</div>
    <div class="url">github.com/nagarete/chronotif/issues</div><div class="url2">chronotif.com</div>`],
];
const XF = 0.35;
const $ = (id) => document.getElementById(id);
const capHTML = (kick, text) => `<div class="cap"><div><div class="kicker">${kick}</div>${text}</div></div>`;

function render(t) {
  let i = SCENES.findIndex(([t0, t1]) => t >= t0 && t < t1);
  if (i < 0) i = t < SCENES[0][0] ? 0 : SCENES.length - 1;
  const [t0, , kick, text, draw] = SCENES[i];
  const prev = SCENES[i - 1];
  const fade = prev ? k(t, t0, t0 + XF) : 1;
  $("layA").innerHTML = prev && fade < 1 ? prev[4](prev[1]) : "";
  $("layB").innerHTML = draw(t);
  $("layB").style.opacity = fade;
  $("capA").innerHTML = prev && fade < 1 ? capHTML(prev[2], prev[3]) : "";
  $("capA").style.opacity = 1 - fade;
  $("capB").innerHTML = capHTML(kick, text);
  $("capB").style.opacity = clamp((t - t0 - 0.15) / 0.3);
  $("full").innerHTML = FULL.filter(([f0, f1]) => t >= f0 && t < f1).map(([f0, f1, html]) =>
    `<div class="full" style="opacity:${f0 === 0 ? 1 - k(t, f1 - XF, f1) : k(t, f0, f0 + XF)}">${html}</div>`).join("");
  // render.mjs awaits this, so no frame is taken before its screens are decoded.
  return Promise.all([...document.querySelectorAll("img")].map((im) => im.decode().catch(() => {})));
}
window.render = render;
window.DURATION = 38.6;
render(Number(new URLSearchParams(location.search).get("t") ?? 0));
</script>
