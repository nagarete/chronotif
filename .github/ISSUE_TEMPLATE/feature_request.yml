name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Chronotif is intentionally small and private (no accounts, and no network use beyond the opt-in updater, Search's currency rates and anonymous Usage data that never includes notifications).
        Ideas that serve NEW / EARLIER, the lock screen, or interacting with real notifications fit best.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see, and why?
    validations:
      required: true
