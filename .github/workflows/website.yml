name: website

# chronotif.com on its own: pull requests that touch website/ get a build check, and merging them
# deploys. build.yml also calls this after each published release, because the download buttons
# are baked in at build time. Release notes (src/releases.json) are left out of the push trigger,
# so new `next` lines go live with a release, not when their pull request merges.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "!website/src/releases.json"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    concurrency:
      group: website-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
      cancel-in-progress: false
    env:
      # Only "true" or "false" leaves the secret here; the token itself is given to the deploy
      # step alone, so npm install scripts and the build never see it.
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: website
    steps:
      # Actions are pinned to commits, since a moved tag would run new code next to the deploy token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A release tag can be older than main; the site always deploys from main.
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Build
        env:
          # The build reads the newest stable and nightly from GitHub's API; the token avoids its rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      # Uploads the dist/ and worker/video-sizes.json the step above built.
      - name: Deploy chronotif.com
        if: github.event_name != 'pull_request' && env.CAN_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
